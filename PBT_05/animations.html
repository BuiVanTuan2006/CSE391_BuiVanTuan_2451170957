<!-- animations.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations</title>
  <link rel="stylesheet" href="animations.css">
</head>
<body>

  <header class="header">
    <h1>Animated Product Cards</h1>
  </header>

  <!-- Loading Spinner -->
  <div class="spinner"></div>

  <!-- Product Section -->
  <section class="products">

    <!-- Card 1 -->
    <div class="card fade-in">
      <div class="image-container">
        <img src="https://picsum.photos/300/200?1" alt="">
      </div>

      <div class="content">
        <h3>Gaming Laptop</h3>
        <p>High performance gaming laptop.</p>
        <button>Buy Now</button>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card fade-in">
      <div class="image-container">
        <img src="https://picsum.photos/300/200?2" alt="">
      </div>

      <div class="content">
        <h3>Wireless Headphones</h3>
        <p>Noise cancelling headphones.</p>
        <button>Buy Now</button>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card fade-in">
      <div class="image-container">
        <img src="https://picsum.photos/300/200?3" alt="">
      </div>

      <div class="content">
        <h3>Smart Watch</h3>
        <p>Track your health and fitness.</p>
        <button>Buy Now</button>
      </div>
    </div>

  </section>

</body>
</html>
